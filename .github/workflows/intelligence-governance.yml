name: Tracknov Intelligence Governance & Safety Layer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  intelligence-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Extraction Accuracy Benchmarks
        run: npx tsx benchmarks/run_all_benchmarks.ts
      - name: Run Intelligence Governance & Replay Proofs
        run: npx tsx scripts/verify_intelligence_governance.ts
      - name: Execute Harita Deterministic Integrity Assertions
        run: |
          npm install
          npx mocha lib/harita-engine/replay/replayValidator.ts --require tsx --exit
