version: '3.8'

services:
  tracknov-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Add your Supabase environment variables here
      # - NEXT_PUBLIC_SUPABASE_URL=
      # - NEXT_PUBLIC_SUPABASE_ANON_KEY=
    # For development, uncomment this to enable hot reload:
    # volumes:
    #   - ./apps/tracknov-web:/app/apps/tracknov-web
    #   - /app/node_modules
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./apps/tracknov-web
    #       target: /app/apps/tracknov-web
    #       ignore:
    #         - node_modules
    #         - .next
    #         - build_output.txt
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional: Uncomment if you need PostgreSQL/Supabase locally
